<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TdyTrip - Chia Tiền Chuyến Đi Phẳng &amp; Tối Giản</title>
  <meta name="description" content="Ứng dụng chia tiền chi phí nhóm và tối ưu công nợ tinh giản, tức thì.">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TdyTrip">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div id="app" class="app-container">
    <!-- App Shell dynamically rendered by src/app.js -->
  </div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./src/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('./sw.js').catch(function(err) {
        console.warn('[PWA] SW register:', err);
      });
    }
  </script>
</body>
</html>
