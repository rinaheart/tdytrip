<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TdyTripPWA2026 — Phase 0 PoC GAS Verifier (v0.2.0)</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b0f19;
        --card: #131b2e;
        --border: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --primary: #38bdf8;
      }
    }
    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container {
      max-width: 680px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 6px;
    }
    .small { font-size: 0.85rem; color: var(--muted); }
    label {
      display: block;
      margin-top: 10px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      min-height: 44px;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    button.warning {
      background: var(--warning);
      color: white;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log-item {
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem;
    }
    .log-item:last-child { border-bottom: none; }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
      margin-right: 6px;
    }
    .badge.pass { background: #dcfce7; color: var(--success); }
    .badge.fail { background: #fee2e2; color: var(--danger); }
    .badge.info { background: #e0f2fe; color: var(--primary); }
    .badge.warn { background: #fef3c7; color: var(--warning); }
    pre {
      background: rgba(0,0,0,0.04);
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 6px 0 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .stat-box {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.02);
      border-radius: 6px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>TdyTripPWA2026 — Phase 0 PoC GAS Verifier</h1>
    <div class="small">Kiểm định chuẩn: WAL Sweep Recovery, Stale Rejection, ID Conflict, Offline Real Test & Đo Latency (p50/p95).</div>
    
    <label for="gasUrl">URL Google Apps Script Web App (Không hardcode, lưu cục bộ):</label>
    <input type="text" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec">
    
    <label for="pocToken">Token bảo mật (Script Property POC_TOKEN):</label>
    <input type="password" id="pocToken" placeholder="Nhập token đã cấu hình trong Script Properties">

    <div class="btn-row">
      <button id="runBtn" onclick="runAutomatedSuite()">Chạy Kiểm Thử Tự Động (1 ⟶ 5)</button>
      <button id="latencyBtn" class="secondary" onclick="runLatencyBenchmark()">Đo Latency (10 Lần)</button>
      <button id="offlineBtn" class="warning" onclick="startInteractiveOfflineTest()">Test Offline Thật (Airplane Mode)</button>
      <button id="exportBtn" class="secondary" onclick="exportReport()" disabled>Xuất Báo Cáo JSON</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <h2 style="font-size:0.95rem; margin:0">Nhật Ký Kiểm Thử (Live Audit Log)</h2>
      <span id="summaryBadge" class="small" style="font-weight:bold">Chưa chạy</span>
    </div>
    <div id="latencyBox" class="stat-box" style="display:none"></div>
    <div id="logContainer" style="margin-top:12px">
      <div class="log-item" style="color:var(--muted)">Nhập URL GAS và bấm "Chạy Kiểm Thử Tự Động" để bắt đầu...</div>
    </div>
  </div>
</div>

<script>
const LS_URL_KEY = 'tdytrip_poc_gas_url';
const LS_TOKEN_KEY = 'tdytrip_poc_token';

const gasUrlInput = document.getElementById('gasUrl');
const pocTokenInput = document.getElementById('pocToken');
const runBtn = document.getElementById('runBtn');
const latencyBtn = document.getElementById('latencyBtn');
const offlineBtn = document.getElementById('offlineBtn');
const exportBtn = document.getElementById('exportBtn');
const logContainer = document.getElementById('logContainer');
const summaryBadge = document.getElementById('summaryBadge');
const latencyBox = document.getElementById('latencyBox');

gasUrlInput.value = localStorage.getItem(LS_URL_KEY) || '';
pocTokenInput.value = localStorage.getItem(LS_TOKEN_KEY) || '';

gasUrlInput.addEventListener('input', () => localStorage.setItem(LS_URL_KEY, gasUrlInput.value.trim()));
pocTokenInput.addEventListener('input', () => localStorage.setItem(LS_TOKEN_KEY, pocTokenInput.value.trim()));

let sessionLogs = [];
let testResults = {};
let latencySamples = [];
let backendInfo = { version: 'unknown', debugCrashEnabled: false };

function appendLog(badgeType, title, detailsObj) {
  const item = document.createElement('div');
  item.className = 'log-item';

  const badge = document.createElement('span');
  badge.className = 'badge ' + badgeType.toLowerCase();
  badge.textContent = badgeType;
  item.appendChild(badge);

  const titleEl = document.createElement('strong');
  titleEl.textContent = ' ' + title;
  item.appendChild(titleEl);

  if (detailsObj !== undefined) {
    const pre = document.createElement('pre');
    pre.textContent = typeof detailsObj === 'object' ? JSON.stringify(detailsObj, null, 2) : String(detailsObj);
    item.appendChild(pre);
  }

  logContainer.appendChild(item);
  sessionLogs.push({ time: new Date().toISOString(), type: badgeType, title: title, details: detailsObj });
}

function genOpId(prefix) {
  return (prefix || 'op') + '-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8);
}

function sanitizeUrl(rawUrl) {
  if (!rawUrl) return '';
  try {
    const u = new URL(rawUrl);
    if (u.searchParams.has('user_content_key')) u.searchParams.set('user_content_key', '[REDACTED]');
    if (u.searchParams.has('token')) u.searchParams.set('token', '[REDACTED]');
    return u.toString();
  } catch (e) {
    return rawUrl.split('?')[0];
  }
}

async function safeFetch(url, options, timeoutMs = 35000) {
  const start = performance.now();
  if (options && options.mode === 'no-cors') {
    throw new Error('mode: no-cors bị nghiêm cấm trong PoC này.');
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  const fetchOpts = Object.assign({}, options, { signal: controller.signal });

  try {
    const res = await fetch(url, fetchOpts);
    clearTimeout(timer);
    const durationMs = Math.round(performance.now() - start);

    const meta = {
      status: res.status,
      statusText: res.statusText,
      type: res.type,
      redirected: res.redirected,
      url: sanitizeUrl(res.url),
      durationMs: durationMs
    };

    if (!res.ok) {
      throw new Error(`HTTP ${res.status} (${res.statusText}) sau ${durationMs}ms`);
    }

    const json = await res.json();
    return { res: res, json: json, meta: meta };
  } catch (err) {
    clearTimeout(timer);
    const durationMs = Math.round(performance.now() - start);
    if (err.name === 'AbortError') {
      throw new Error(`Request timeout sau ${durationMs}ms (vượt ngưỡng client timeout ${timeoutMs}ms)`);
    }
    throw err;
  }
}

async function runAutomatedSuite() {
  const url = gasUrlInput.value.trim();
  const token = pocTokenInput.value.trim();

  if (!url) {
    alert('Vui lòng nhập URL Google Apps Script Web App.');
    gasUrlInput.focus();
    return;
  }

  logContainer.textContent = '';
  sessionLogs = [];
  testResults = {};
  runBtn.disabled = true;
  exportBtn.disabled = true;
  summaryBadge.textContent = 'Đang chạy kiểm thử...';

  appendLog('INFO', 'Bắt đầu kiểm thử PoC v0.2.0', {
    origin: window.location.origin,
    userAgent: navigator.userAgent
  });

  let overallPass = true;
  const testRecId = 'rec-' + Date.now();

  try {
    // -------------------------------------------------------------
    // TEST 1: GET Ping, Token Check & CORS Inspection
    // -------------------------------------------------------------
    appendLog('INFO', 'Test 1: GET Ping & Token & CORS Verification');
    try {
      const pingUrl = url + (url.includes('?') ? '&' : '?') + 'action=ping' + (token ? '&token=' + encodeURIComponent(token) : '');
      const t1 = await safeFetch(pingUrl, { method: 'GET', mode: 'cors' });
      
      if (t1.json && t1.json.ok === true) {
        backendInfo.version = t1.json.version || 'v0.1.0';
        backendInfo.debugCrashEnabled = Boolean(t1.json.debugCrashEnabled);
        testResults.test1_ping = { pass: true, version: backendInfo.version, meta: t1.meta };
        appendLog('PASS', `Test 1 ĐẠT: Backend version ${backendInfo.version}, debugCrash=${backendInfo.debugCrashEnabled}`, { meta: t1.meta, response: t1.json });
      } else {
        throw new Error('Response không chứa ok===true: ' + JSON.stringify(t1.json));
      }
    } catch (e1) {
      testResults.test1_ping = { pass: false, error: e1.message };
      appendLog('FAIL', 'Test 1 THẤT BẠI: Lỗi CORS hoặc Token', e1.message);
      overallPass = false;
    }

    // -------------------------------------------------------------
    // TEST 2: Input Validation & Error Replay (No Orphan PENDING_APPLY)
    // -------------------------------------------------------------
    const opVal = genOpId('op-val');
    appendLog('INFO', 'Test 2: Kiểm tra Validation & Replay lỗi (Không để PENDING_APPLY mồ côi)', { opId: opVal });
    try {
      // 2a: Gửi amount âm (-50000)
      const invalidPayload = {
        token: token,
        opId: opVal,
        type: 'EXPENSE_CREATE',
        payload: { title: 'Test âm tiền', amount: -50000, splitMethod: 'equal' }
      };
      const t2a = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(invalidPayload)
      });

      if (t2a.json && t2a.json.ok === false && t2a.json.error === 'ERR_VALIDATION') {
        appendLog('PASS', 'Test 2a ĐẠT: Server phát hiện và từ chối ERR_VALIDATION chuẩn xác', t2a.json);
      } else {
        throw new Error('Server không trả về ERR_VALIDATION khi amount âm: ' + JSON.stringify(t2a.json));
      }

      // 2b: Replay cùng opVal cũ -> Server BẮT BUỘC trả lại đúng lỗi cũ, không chạy lại
      const t2b = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(invalidPayload)
      });

      if (t2b.json && t2b.json.ok === false && t2b.json.duplicate === true && t2b.json.error === 'ERR_VALIDATION') {
        testResults.test2_validation = { pass: true };
        appendLog('PASS', 'Test 2b ĐẠT: Replay thao tác bị reject trả về đúng lỗi cũ (Idempotent Rejection, không mồ côi PENDING_APPLY)', t2b.json);
      } else {
        throw new Error('Replay validation error không trả về đúng lỗi cũ: ' + JSON.stringify(t2b.json));
      }
    } catch (e2) {
      testResults.test2_validation = { pass: false, error: e2.message };
      appendLog('FAIL', 'Test 2 THẤT BẠI', e2.message);
      overallPass = false;
    }

    // -------------------------------------------------------------
    // TEST 3: POST CREATE & ID Conflict Detection
    // -------------------------------------------------------------
    const op3a = genOpId('op-create-1');
    const op3b = genOpId('op-conflict');
    appendLog('INFO', 'Test 3: POST CREATE & Kiểm tra chống trùng ID (ERR_ID_CONFLICT)', { id: testRecId });
    try {
      // 3a: Tạo bản ghi mới hợp lệ
      const createPayload = {
        token: token,
        opId: op3a,
        type: 'EXPENSE_CREATE',
        payload: { id: testRecId, title: 'Ăn tối nhóm', amount: 350000, splitMethod: 'equal' }
      };
      const t3a = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(createPayload)
      });

      if (t3a.json && t3a.json.ok === true && t3a.json.record && t3a.json.record.rev === 1) {
        appendLog('PASS', 'Test 3a ĐẠT: Tạo bản ghi thành công (rev=1, amount=350000)', t3a.json.record);
      } else {
        throw new Error('Tạo bản ghi thất bại: ' + JSON.stringify(t3a.json));
      }

      // 3b: Cố tình tạo bản ghi với CÙNG testRecId nhưng opId khác (op3b) -> Bắt buộc ERR_ID_CONFLICT
      const conflictPayload = {
        token: token,
        opId: op3b,
        type: 'EXPENSE_CREATE',
        payload: { id: testRecId, title: 'Cố tình trùng ID', amount: 100000, splitMethod: 'equal' }
      };
      const t3b = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(conflictPayload)
      });

      if (t3b.json && t3b.json.ok === false && t3b.json.error === 'ERR_ID_CONFLICT') {
        testResults.test3_create_id_conflict = { pass: true };
        appendLog('PASS', 'Test 3b ĐẠT: Server phát hiện trùng ID khác opId, trả về ERR_ID_CONFLICT chuẩn xác (Không báo duplicate ảo)', t3b.json);
      } else {
        throw new Error('Server không chặn trùng ID khi khác opId: ' + JSON.stringify(t3b.json));
      }
    } catch (e3) {
      testResults.test3_create_id_conflict = { pass: false, error: e3.message };
      appendLog('FAIL', 'Test 3 THẤT BẠI', e3.message);
      overallPass = false;
    }

    // -------------------------------------------------------------
    // TEST 4: Concurrency Stale Revision & Replay Stale Error
    // -------------------------------------------------------------
    appendLog('INFO', 'Test 4: Đối kháng Concurrency & Replay Stale Revision');
    try {
      const op4B = genOpId('op-upd-B');
      const op4A = genOpId('op-upd-A');

      // Client B cập nhật hợp lệ expectedRev: 1 -> rev: 2
      const payload4B = {
        token: token,
        opId: op4B,
        type: 'EXPENSE_UPDATE',
        payload: { id: testRecId, expectedRev: 1, title: 'Ăn tối (Client B sửa)', amount: 400000 }
      };
      const t4b = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload4B)
      });

      if (!t4b.json || t4b.json.ok !== true || t4b.json.record.rev !== 2) {
        throw new Error('Client B cập nhật không đạt rev=2: ' + JSON.stringify(t4b.json));
      }
      appendLog('PASS', 'Test 4a ĐẠT: Client B cập nhật thành công lên rev=2', t4b.json.record);

      // Client A cố tình gửi expectedRev: 1 cũ -> Bắt buộc ERR_STALE_REV
      const payload4A = {
        token: token,
        opId: op4A,
        type: 'EXPENSE_UPDATE',
        payload: { id: testRecId, expectedRev: 1, title: 'Ăn tối (Client A sửa cũ)', amount: 450000 }
      };
      const t4a = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload4A)
      });

      if (!t4a.json || t4a.json.ok !== false || t4a.json.error !== 'ERR_STALE_REV') {
        throw new Error('Server không từ chối ERR_STALE_REV: ' + JSON.stringify(t4a.json));
      }
      appendLog('PASS', 'Test 4b ĐẠT: Server từ chối Stale Rev và trả về currentRecord (rev=2)', t4a.json);

      // Replay op4A cũ -> Vẫn trả về đúng ERR_STALE_REV cũ
      const t4a_replay = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload4A)
      });
      if (t4a_replay.json && t4a_replay.json.ok === false && t4a_replay.json.duplicate === true && t4a_replay.json.error === 'ERR_STALE_REV') {
        testResults.test4_concurrency = { pass: true };
        appendLog('PASS', 'Test 4c ĐẠT: Replay Stale Operation trả về đúng lỗi cũ (không để PENDING_APPLY mồ côi)', t4a_replay.json);
      } else {
        throw new Error('Replay stale op thất bại: ' + JSON.stringify(t4a_replay.json));
      }
    } catch (e4) {
      testResults.test4_concurrency = { pass: false, error: e4.message };
      appendLog('FAIL', 'Test 4 THẤT BẠI', e4.message);
      overallPass = false;
    }

    // -------------------------------------------------------------
    // TEST 5: DELETE Tombstone
    // -------------------------------------------------------------
    appendLog('INFO', 'Test 5: Xóa bản ghi bằng Tombstone (deleted=true, rev=3)');
    try {
      const op5 = genOpId('op-del');
      const delPayload = {
        token: token,
        opId: op5,
        type: 'EXPENSE_DELETE',
        payload: { id: testRecId, expectedRev: 2 }
      };
      const t5 = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(delPayload)
      });

      if (t5.json && t5.json.ok === true && t5.json.record && t5.json.record.deleted === true && t5.json.record.rev === 3) {
        testResults.test5_delete = { pass: true, record: t5.json.record };
        appendLog('PASS', 'Test 5 ĐẠT: Xóa bằng Tombstone thành công (deleted=true, rev=3)', t5.json.record);
      } else {
        throw new Error('DELETE không trả về tombstone hợp lệ: ' + JSON.stringify(t5.json));
      }

      // -------------------------------------------------------------
      // TEST 5b: Cố tình UPDATE hoặc DELETE bản ghi đã xóa (ERR_ALREADY_DELETED)
      // -------------------------------------------------------------
      appendLog('INFO', 'Test 5b: Thử UPDATE và DELETE trên bản ghi đã Tombstone (Kỳ vọng ERR_ALREADY_DELETED)');
      const op5b_upd = genOpId('op-upd-del');
      const t5b_upd = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: token,
          opId: op5b_upd,
          type: 'EXPENSE_UPDATE',
          payload: { id: testRecId, expectedRev: 3, title: 'Cố tình sửa bản ghi đã xóa' }
        })
      });
      if (t5b_upd.json && t5b_upd.json.ok === false && t5b_upd.json.error === 'ERR_ALREADY_DELETED') {
        appendLog('PASS', 'Test 5b-1 ĐẠT: Server từ chối UPDATE bản ghi đã xóa (ERR_ALREADY_DELETED)');
      } else {
        throw new Error('Server không trả ERR_ALREADY_DELETED khi UPDATE: ' + JSON.stringify(t5b_upd.json));
      }

      const op5b_del = genOpId('op-del-del');
      const t5b_del = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: token,
          opId: op5b_del,
          type: 'EXPENSE_DELETE',
          payload: { id: testRecId, expectedRev: 3 }
        })
      });
      if (t5b_del.json && t5b_del.json.ok === false && t5b_del.json.error === 'ERR_ALREADY_DELETED') {
        testResults.test5_delete.alreadyDeletedCheck = true;
        appendLog('PASS', 'Test 5b-2 ĐẠT: Server từ chối DELETE lại bản ghi đã xóa (ERR_ALREADY_DELETED)');
      } else {
        throw new Error('Server không trả ERR_ALREADY_DELETED khi DELETE lại: ' + JSON.stringify(t5b_del.json));
      }

    } catch (e5) {
      testResults.test5_delete = { pass: false, error: e5.message };
      appendLog('FAIL', 'Test 5 THẤT BẠI', e5.message);
      overallPass = false;
    }

    // -------------------------------------------------------------
    // TEST 6: Crash Simulation & Sweep (Chỉ chạy khi DEBUG_CRASH_ENABLED=true)
    // -------------------------------------------------------------
    if (backendInfo.debugCrashEnabled) {
      appendLog('INFO', 'Test 6: Mô phỏng Crash Server có kiểm soát (DEBUG_CRASH_ENABLED=true)');
      try {
        // 6a: Crash SAU KHI ghi row nghiệp vụ nhưng trước ACKED
        const opCrashA = genOpId('op-crash-A');
        const recCrashA = 'rec-crash-A-' + Date.now();
        appendLog('INFO', 'Test 6a: Mô phỏng crash sau khi ghi business row (debugCrash="afterBusinessWrite")...');
        try {
          await safeFetch(url, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              token: token,
              opId: opCrashA,
              type: 'EXPENSE_CREATE',
              payload: { id: recCrashA, title: 'Crash After Write', amount: 50000, splitMethod: 'equal' },
              debugCrash: 'afterBusinessWrite'
            })
          });
        } catch (simErr) {
          appendLog('WARN', 'Server crash hợp lệ theo kịch bản afterBusinessWrite.', simErr.message);
        }

        // Dummy op kích hoạt sweep
        const opDummy1 = genOpId('op-dummy-1');
        await safeFetch(url, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: token,
            opId: opDummy1,
            type: 'EXPENSE_CREATE',
            payload: { id: 'rec-dummy-1-' + Date.now(), title: 'Dummy Trigger Sweep', amount: 10000, splitMethod: 'equal' }
          })
        });

        // Client A retry -> Bắt buộc chốt ACKED
        const t6a = await safeFetch(url, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: token,
            opId: opCrashA,
            type: 'EXPENSE_CREATE',
            payload: { id: recCrashA, title: 'Crash After Write', amount: 50000, splitMethod: 'equal' }
          })
        });

        if (t6a.json && t6a.json.ok === true && t6a.json.duplicate === true) {
          appendLog('PASS', 'Test 6a ĐẠT: Sweep chốt ACKED thành công sau crash afterBusinessWrite.');
        } else {
          throw new Error('Test 6a thất bại: ' + JSON.stringify(t6a.json));
        }

        // 6b: Crash SAU KHI ACKED nhưng trước khi trả HTTP response
        const opCrashB = genOpId('op-crash-B');
        const recCrashB = 'rec-crash-B-' + Date.now();
        appendLog('INFO', 'Test 6b: Mô phỏng crash sau ACKED (debugCrash="afterAck")...');
        try {
          await safeFetch(url, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              token: token,
              opId: opCrashB,
              type: 'EXPENSE_CREATE',
              payload: { id: recCrashB, title: 'Crash After Ack', amount: 60000, splitMethod: 'equal' },
              debugCrash: 'afterAck'
            })
          });
        } catch (simErrB) {
          appendLog('WARN', 'Server crash hợp lệ theo kịch bản afterAck.', simErrB.message);
        }

        const t6b = await safeFetch(url, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: token,
            opId: opCrashB,
            type: 'EXPENSE_CREATE',
            payload: { id: recCrashB, title: 'Crash After Ack', amount: 60000, splitMethod: 'equal' }
          })
        });
        if (t6b.json && t6b.json.ok === true && t6b.json.duplicate === true && t6b.json.source === 'history_acked') {
          appendLog('PASS', 'Test 6b ĐẠT: Replay sau crash afterAck trả đúng history_acked.');
        } else {
          throw new Error('Test 6b thất bại: ' + JSON.stringify(t6b.json));
        }

        // 6c: Crash TRƯỚC KHI ghi row nghiệp vụ -> Sweep đánh ABORTED -> Retry BẮT BUỘC thực thi lại (ACKED)!
        const opCrashC = genOpId('op-crash-C');
        const recCrashC = 'rec-crash-C-' + Date.now();
        appendLog('INFO', 'Test 6c: Mô phỏng crash trước khi ghi business row (debugCrash="beforeBusinessWrite")...');
        try {
          await safeFetch(url, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              token: token,
              opId: opCrashC,
              type: 'EXPENSE_CREATE',
              payload: { id: recCrashC, title: 'Crash Before Business Write', amount: 70000, splitMethod: 'equal' },
              debugCrash: 'beforeBusinessWrite'
            })
          });
        } catch (simErrC) {
          appendLog('WARN', 'Server crash hợp lệ theo kịch bản beforeBusinessWrite.', simErrC.message);
        }

        // Dummy op kích hoạt sweep đánh opCrashC thành ABORTED
        const opDummy2 = genOpId('op-dummy-2');
        await safeFetch(url, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: token,
            opId: opDummy2,
            type: 'EXPENSE_CREATE',
            payload: { id: 'rec-dummy-2-' + Date.now(), title: 'Dummy Trigger Sweep 2', amount: 10000, splitMethod: 'equal' }
          })
        });

        // Client A retry lại cùng opCrashC -> Server KHÔNG ĐƯỢC từ chối retryable:false mà PHẢI áp dụng thành công lên ACKED!
        appendLog('INFO', 'Test 6c: Client A retry opCrashC sau khi đã bị sweep ABORTED...');
        const t6c = await safeFetch(url, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            token: token,
            opId: opCrashC,
            type: 'EXPENSE_CREATE',
            payload: { id: recCrashC, title: 'Crash Before Business Write', amount: 70000, splitMethod: 'equal' }
          })
        });

        const countUrl = url + (url.includes('?') ? '&' : '?') + 'action=count&opId=' + encodeURIComponent(opCrashC) + (token ? '&token=' + encodeURIComponent(token) : '');
        const c6 = await safeFetch(countUrl, { method: 'GET', mode: 'cors' });

        if (t6c.json && t6c.json.ok === true && c6.json && c6.json.count === 1) {
          testResults.test6_crash_recovery = { pass: true, count: 1, abortedReplayFixVerified: true };
          appendLog('PASS', 'Test 6c ĐẠT: Thao tác bị ABORTED đã được thực thi lại thành công khi retry! count=1.', {
            response: t6c.json,
            count: c6.json
          });
        } else {
          throw new Error('Test 6c thất bại (Bị từ chối hoặc count != 1): ' + JSON.stringify(t6c.json));
        }

      } catch (e6) {
        testResults.test6_crash_recovery = { pass: false, error: e6.message };
        appendLog('FAIL', 'Test 6 THẤT BẠI', e6.message);
        overallPass = false;
      }
    } else {
      appendLog('INFO', 'Test 6 (Crash Simulation) BỎ QUA vì DEBUG_CRASH_ENABLED=false (Chỉ bật trong Script Properties khi cần kiểm tra).');
    }

  } catch (fatal) {
    overallPass = false;
    appendLog('FAIL', 'LỖI KHÔNG XÁC ĐỊNH', fatal.message);
  } finally {
    runBtn.disabled = false;
    exportBtn.disabled = false;
    if (overallPass) {
      summaryBadge.textContent = '100% PASS';
      summaryBadge.style.color = 'var(--success)';
    } else {
      summaryBadge.textContent = 'CÓ BÀI THẤT BẠI';
      summaryBadge.style.color = 'var(--danger)';
    }
  }
}

// -------------------------------------------------------------
// ĐO ĐẠC LATENCY (10 LẦN LIÊN TIẾP)
// -------------------------------------------------------------
async function runLatencyBenchmark() {
  const url = gasUrlInput.value.trim();
  const token = pocTokenInput.value.trim();
  if (!url) { alert('Vui lòng nhập URL GAS.'); return; }

  latencyBtn.disabled = true;
  latencyBox.style.display = 'block';
  latencyBox.textContent = 'Đang đo latency (10 requests liên tiếp)...';
  latencySamples = [];

  for (let i = 1; i <= 10; i++) {
    const pingUrl = url + (url.includes('?') ? '&' : '?') + 'action=ping' + (token ? '&token=' + encodeURIComponent(token) : '') + '&_t=' + Date.now();
    try {
      const res = await safeFetch(pingUrl, { method: 'GET', mode: 'cors' });
      latencySamples.push(res.meta.durationMs);
      latencyBox.textContent = `Đã đo ${i}/10 lần... Lần gần nhất: ${res.meta.durationMs}ms`;
    } catch (e) {
      latencySamples.push(9999);
    }
  }

  latencySamples.sort((a, b) => a - b);
  const min = latencySamples[0];
  const max = latencySamples[latencySamples.length - 1];
  const p50 = latencySamples[Math.floor(latencySamples.length * 0.5)];
  const p95 = latencySamples[Math.floor(latencySamples.length * 0.95)];
  const avg = Math.round(latencySamples.reduce((a, b) => a + b, 0) / latencySamples.length);

  testResults.latencyStats = { min, max, p50, p95, avg, samples: latencySamples };

  latencyBox.innerHTML = `<strong>Kết Quả Latency (10 calls):</strong> Min: ${min}ms | Avg: ${avg}ms | <strong>p50: ${p50}ms</strong> | <strong>p95: ${p95}ms</strong> | Max: ${max}ms`;
  appendLog('INFO', 'Kết Quả Đo Latency 10 Lần', testResults.latencyStats);

  if (p50 > 2500) {
    appendLog('WARN', 'CẢNH BÁO LATENCY CAO: p50 > 2.5s. Với tốc độ này, việc đẩy FIFO từng thao tác tuần tự khi có 5-10 pending ops sẽ mất 15-25s. Ở Phase 3 bắt buộc thiết kế cơ chế Batch Operations (gộp nhiều op vào 1 POST payload) để giảm thời gian chờ của người dùng!');
  }

  latencyBtn.disabled = false;
  exportBtn.disabled = false;
}

// -------------------------------------------------------------
// TEST OFFLINE THẬT (AIRPLANE MODE INTERACTIVE)
// -------------------------------------------------------------
let offlineOpId = null;
let offlineRecId = null;

function startInteractiveOfflineTest() {
  const url = gasUrlInput.value.trim();
  const token = pocTokenInput.value.trim();
  if (!url) { alert('Vui lòng nhập URL GAS.'); return; }

  offlineOpId = genOpId('op-offline-real');
  offlineRecId = 'rec-off-' + Date.now();

  appendLog('WARN', '--- BƯỚC 1 TEST OFFLINE THẬT ---', {
    huongDan: '1. Hãy BẬT CHẾ ĐỘ MÁY BAY (Airplane Mode) trên điện thoại ngay bây giờ.\n2. Sau khi đã tắt toàn bộ Wifi/4G, hãy bấm nút "Gửi Trong Lúc Mất Mạng" bên dưới.'
  });

  const btnStep1 = document.createElement('button');
  btnStep1.textContent = 'Gửi Trong Lúc Mất Mạng (Phải Báo Lỗi Mạng)';
  btnStep1.onclick = async () => {
    btnStep1.disabled = true;
    try {
      appendLog('INFO', 'Đang thử gửi thao tác khi ngoại tuyến...', { opId: offlineOpId });
      await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: token,
          opId: offlineOpId,
          type: 'EXPENSE_CREATE',
          payload: { id: offlineRecId, title: 'Khoản chi ghi lúc mất mạng', amount: 80000, splitMethod: 'equal' }
        })
      });
      appendLog('FAIL', 'THẤT BẠI: Lẽ ra phải rớt mạng nhưng request lại thành công! Bạn chưa bật chế độ máy bay?');
    } catch (netErr) {
      appendLog('PASS', 'ĐẠT: Đã bắt được lỗi mất mạng hợp lệ! Thao tác được giữ an toàn trong hàng đợi.', netErr.message);
      promptReconnect();
    }
  };
  logContainer.appendChild(btnStep1);
}

function promptReconnect() {
  appendLog('WARN', '--- BƯỚC 2 TEST OFFLINE THẬT ---', {
    huongDan: '1. Bây giờ hãy TẮT CHẾ ĐỘ MÁY BAY (Bật lại Wifi/4G).\n2. Chờ điện thoại có sóng mạng ổn định.\n3. Bấm nút "Gửi Lại Cùng opId (Replay)" bên dưới để xác minh.'
  });

  const url = gasUrlInput.value.trim();
  const token = pocTokenInput.value.trim();

  const btnStep2 = document.createElement('button');
  btnStep2.textContent = 'Gửi Lại Cùng opId (Đã Có Mạng Trở Lại)';
  btnStep2.onclick = async () => {
    btnStep2.disabled = true;
    try {
      appendLog('INFO', 'Đang gửi lại cùng opId sau khi có mạng...', { opId: offlineOpId });
      const res = await safeFetch(url, {
        method: 'POST',
        mode: 'cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          token: token,
          opId: offlineOpId,
          type: 'EXPENSE_CREATE',
          payload: { id: offlineRecId, title: 'Khoản chi ghi lúc mất mạng', amount: 80000, splitMethod: 'equal' }
        })
      });

      const countUrl = url + (url.includes('?') ? '&' : '?') + 'action=count&opId=' + encodeURIComponent(offlineOpId) + (token ? '&token=' + encodeURIComponent(token) : '');
      const cnt = await safeFetch(countUrl, { method: 'GET', mode: 'cors' });

      if (res.json && res.json.ok === true && cnt.json && cnt.json.count === 1) {
        testResults.test_offline_real = { pass: true, count: 1 };
        appendLog('PASS', 'TEST OFFLINE THẬT HOÀN TOÀN ĐẠT! Ghi nhận thành công, Sheet có đúng 1 dòng duy nhất, không mất mát hay trùng lặp.', {
          res: res.json,
          count: cnt.json
        });
      } else {
        throw new Error('Số dòng không bằng 1 hoặc phản hồi lỗi: ' + JSON.stringify(res.json));
      }
    } catch (e) {
      appendLog('FAIL', 'Gửi lại sau khi có mạng thất bại', e.message);
    }
  };
  logContainer.appendChild(btnStep2);
}

// -------------------------------------------------------------
// XUẤT BÁO CÁO JSON (ĐÃ SANITIZE BẢO MẬT)
// -------------------------------------------------------------
function exportReport() {
  const url = gasUrlInput.value.trim();
  const sanitizedDomain = url.split('/')[2] || 'unknown';

  const report = {
    appName: 'TdyTripPWA2026 Phase 0 PoC Verification',
    harnessVersion: 'v0.2.1',
    backendVersion: backendInfo.version || 'unknown',
    reportVersion: 'v0.2.1',
    exportedAt: new Date().toISOString(),
    environment: {
      origin: window.location.origin,
      protocol: window.location.protocol,
      userAgent: navigator.userAgent,
      screen: `${window.innerWidth}x${window.innerHeight}`
    },
    backendInfo: {
      domain: sanitizedDomain,
      version: backendInfo.version,
      debugCrashEnabled: backendInfo.debugCrashEnabled,
      hasTokenConfigured: Boolean(pocTokenInput.value.trim())
    },
    latencyStats: testResults.latencyStats || null,
    testResults: testResults,
    auditLogs: sessionLogs
  };

  const jsonStr = JSON.stringify(report, null, 2);

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(jsonStr).then(() => {
      alert('Đã sao chép báo cáo JSON bảo mật vào Clipboard!');
    }).catch(() => {});
  }

  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isAndroid = /Android/i.test(navigator.userAgent);
  const devType = isIOS ? 'ios' : (isAndroid ? 'android' : 'desktop');

  const blob = new Blob([jsonStr], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `poc_report_${devType}_${Date.now()}.json`;
  a.click();
}
